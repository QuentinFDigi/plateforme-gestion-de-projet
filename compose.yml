services:
  mysql:
    image: mysql:8
    container_name: pgdp_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pgdp
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - spring-net

  spring-app:
    build: .
    container_name: pgdp_api
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - spring-net

volumes:
  mysqldata:

networks:
  spring-net:
